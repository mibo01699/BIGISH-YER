name: BIGISH-YER Ecosystem CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Clean Install Required Modules
      run: |
        npm init -y
        npm install bignumber.js express axios --save
      
    - name: Execute Clean Sovereign Visa & Gaming Audit
      run: |
        node testVisaRecharge.js
        node testGamingRecharge.js
