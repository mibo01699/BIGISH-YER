name: BIGISH-YER Ecosystem CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install Ecosystem Dependencies
      run: npm install
      
    - name: Run Sovereign Ecosystem & Gaming & Visa Tests
      run: npm test
