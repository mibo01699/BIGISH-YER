name: BIGISH-YER Ecosystem CI-CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. نسخ الكود من المستودع السيادي
      uses: actions/checkout@v3

    - name: 2. تهيئة بيئة تشغيل Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: 3. تثبيت الحزم والاعتماديات
      run: npm install

    - name: 4. 🔥 تشغيل اختبار الضغط والمقاصة لمليون عملية دفع هجين
      run: node stressTestFlexibleHybrid.js

    - name: 5. 🔄 تشغيل اختبار تكامل مجمعات السيولة الآلية AMM / DEX
      run: node testDexIntegration.js

    - name: 6. ⛏ تشغيل فحص حوكمة صمام أمان التعدين المجاني 10%
      run: node testMiningGovernance.js

    - name: 7. 🔐 تشغيل فحص قيود الحوكمة للـ 90 مليون عملة المخصصة للإدراج
      run: node testVestingGovernance.js
