name: Build & Test (UNICEF Submission)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment (v22)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Execute Sovereign Clearing Validation
      run: |
        echo "🦅 بدء تشغيل بيئة فحص المقاصة المستقلة لصندوق النسر العربي والريال الرقمي..."
        node app.js
