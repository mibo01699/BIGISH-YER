name: Generate and Verify Lockfile

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'  # تم التحديث من 20 إلى 22

    - name: Clean install dependencies
      run: |
        rm -rf node_modules package-lock.json yarn.lock
        npm install

    - name: Run Tests with verbose output
      run: npm test -- --verbose --force-exit

    - name: Print full logs on failure
      if: failure()
      run: cat /home/runner/.npm/_logs/*-debug.log || true