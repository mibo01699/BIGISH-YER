name: "BIGISH-YER Ecosystem CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: 3. Install Dependencies
      run: npm install

    - name: 4. Run Automated Security Jest Test
      run: npm test

    - name: 5. Run Python Stabilization Simulation
      run: |
        if [ -f simulation.py ]; then
          python3 simulation.py
        fi
