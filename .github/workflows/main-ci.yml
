name: BIGISH-YER Ecosystem CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Repository Checkout
      uses: actions/checkout@v4

    - name: 2. Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: 3. Install Dependencies
      run: npm install

    # تشغيل الاختبارات بشكل صارم. إذا فشلت، سيفشل السير.
    - name: 4. Run Automated Tests (Strict)
      run: npm test