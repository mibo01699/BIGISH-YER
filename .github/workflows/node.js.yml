name: BIGISH-YER Ecosystem CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18' # أو الإصدار المتوافق مع مشروعك

    - name: Install Node.js dependencies
      run: npm install

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Python Simulation Test
      run: |
        if [ -f simulation.py ]; then
          python simulation.py
        fi
