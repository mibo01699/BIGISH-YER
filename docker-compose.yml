version: '3.8'

services:
  yer-wallet-backend:
    build: .
    container_name: yer_wallet_core
    ports:
      - "5000:5000"  # تم التصحيح إلى المنفذ الصحيح 5000
    environment:
      - NODE_ENV=production
      - PI_NETWORK_ENVIRONMENT=sandbox  # تم التصحيح من mainnet إلى sandbox
    depends_on:
      - yer-db
    restart: always

  yer-db:
    image: postgres:15-alpine
    container_name: yer_wallet_db
    environment:
      - POSTGRES_DB=bigish_yer_db
      - POSTGRES_USER=yer_governor
      # استخدام متغير بيئة خارجي لتجنب كشف كلمة المرور في المستودع
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-please_change_me_in_env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: always

volumes:
  pgdata: