# .github/workflows/node-ci.yml
name: 🛡️ BIGISH-YER Ecosystem CI Suite

# تحديد الأحداث التي تطلق الفحص الآلي للمستودع
on:
  push:
    branches: [ "main" ] # يعمل عند الرفع مباشرة لفرع المشروع الرئيسي
  pull_request:
    branches: [ "main" ] # يعمل عند فتح طلب دمج برمي للمراجعة

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] # الفحص على بيئة نود المستقرة المعتمدة للمشروع

    steps:
    - name: 📥 Checkout Repository Code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js Environment (${{ matrix.node-version }})
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' # تفعيل الكاش لتسريع عمليات الفحص البرمجي

    - name: 📦 Install Application Dependencies
      run: npm ci # تثبيت نظيف ومطابق تماماً لملف package-lock.json

    - name: 🔬 Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # تجهيز البيئة اللازمة لتشغيل محاكي الاستقرار الاقتصادي

    - name: 📊 Validate Python Macroeconomic Simulation Script
      run: python simulation.py # التحقق من خلو ملف محاكاة ليدجر السيولة من الأخطاء

    - name: 🛡️ Execute Core Ledger & Security Test Cases
      run: npm test # تشغيل فحص المقاصة ومحرك حماية التشفير AES-256-GCM تلقائياً
      env:
        # حقن مفتاح تشفير وهمي وآمن مخصص فقط لبيئة فحص السيرفر المؤتمت
        DATABASE_ENCRYPTION_KEY: "cc77ffaa99887766554433221100ffeecc77ffaa99887766554433221100ffee"
        NODE_ENV: test
