<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAV-YEM Ecosystem Terminal</title>
    <!-- استدعاء مكتبة Pi SDK الرسمية - إلزامي للمنصة -->
    <script src="https://minepi.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { background: #eab308; color: #1e293b; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn:disabled { background: #64748b; cursor: not-allowed; }
        .status-box { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #eab308; }
    </style>
</head>
<body>
    <div class="container">
        <h2>منصة إطلاق النظام البيئي GAV-YEM (تحديث 2026)</h2>
        
        <div class="status-box" id="authStatus">
            <p>🔴 حالة الاتصال: يرجى تسجيل الدخول باستخدام حساب Pi Network الخاص بك عبر متصفح Pi Browser.</p>
        </div>

        <button class="btn" id="loginBtn" onclick="authenticatePiUser()">تسجيل الدخول عبر Pi SDK</button>

        <div id="mainDashboard" style="display: none; margin-top: 20px;">
            <h3>بوابة الخدمات اللوجستية وسلسلة التوريد (YER Utility)</h3>
            <p>مرحباً، <span id="piUsername" style="color: #eab308; font-weight: bold;"></span></p>
            
            <div class="status-box">
                <p>رصيد الـ YER المتاح للخدمات: <span id="yerBalance">0.000000</span> YER</p>
            </div>

            <button class="btn" onclick="triggerGAVPayment(10)">دفع رسوم خدمة التوريد (10 Pi)</button>
        </div>
    </div>

    <script src="wallet-core.js"></script>
    <script src="gav-core.js"></script>
</body>
</html>
