<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bigish-YER | متجر بي جش اليمن</title>
    <link rel="stylesheet" href="style-custom.css">
    <!-- استدعاء Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <img src="logo.png" alt="Bigish Logo" class="logo">
            <div id="user-info">جاري الاتصال بـ Pi...</div>
        </header>

        <main>
            <section class="balance-card">
                <h3>رصيدك المتوفر</h3>
                <p id="balance">-- Pi</p>
            </section>

            <section class="products">
                <div class="pi-card">
                    <h4>سلة مواد غذائية (مثال)</h4>
                    <p>السعر: 0.5 Pi</p>
                    <button class="pi-button" onclick="handlePurchase('p1', 0.5, 'شراء سلة غذائية')">اشترِ الآن بـ Pi</button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="#home">الرئيسية</a>
            <a href="#orders">طلباتي</a>
            <a href="privacy.html">الخصوصية</a>
        </nav>
    </div>

    <!-- استدعاء ملفات المنطق -->
    <script src="utils/piSDK.js"></script>
    <script src="services/paymentService.js"></script>
    <script src="app-logic.js"></script>
</body>
</html>
