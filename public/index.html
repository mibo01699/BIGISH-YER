<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIGISH-YER Wallet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    :root { --primary: #1a4d2e; --primary-light: #2d7a4a; --gold: #d4af37; --bg: #f5f7fa; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); direction: rtl; min-height: 100vh; }
    .top-bar { background: var(--primary); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.2rem; font-weight: bold; }
    .network-badge { font-size: 0.85rem; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 12px; }
    .container { max-width: 600px; margin: 16px auto; padding: 0 12px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .card h1, .card h2 { color: var(--primary); margin-bottom: 12px; }
    button { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; border: none; padding: 14px 24px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 12px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #e74c3c; margin-top: 10px; padding: 8px; background: #fdecea; border-radius: 6px; display: none; }
    .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .balance-item { background: #f8f9fa; padding: 16px; border-radius: 10px; text-align: center; }
    .balance-item .label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 6px; }
    .balance-item .value { display: block; font-size: 1.5rem; font-weight: bold; color: var(--primary); }
    .status-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .badge.pending { background: #fff3cd; color: #856404; }
    .badge.online { background: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="logo">🦅 BIGISH-YER</div>
    <div class="network-badge" id="network-badge">Testnet</div>
  </header>
  <main class="container">
    <section id="login-section" class="card">
      <h1>محفظة BIGISH-YER</h1>
      <p>محفظة دفع هجينة: Pi + YER</p>
      <button id="login-btn">🚀 تسجيل الدخول بحساب Pi</button>
      <div id="login-error" class="error"></div>
    </section>
    <section id="wallet-section" style="display:none;">
      <div class="card">
        <h2>مرحباً، <span id="user-name"></span></h2>
        <p>معرف Pi: <span id="user-id"></span></p>
      </div>
      <div class="card">
        <h2>💰 الرصيد</h2>
        <div class="balance-grid">
          <div class="balance-item"><span class="label">Pi</span><span class="value" id="pi-balance">0.00</span></div>
          <div class="balance-item"><span class="label">YER</span><span class="value" id="yer-balance">0.00</span></div>
        </div>
      </div>
      <div class="card">
        <h2>💳 الدفع</h2>
        <button id="pay-pi-btn">دفع بـ Pi فقط</button>
        <button id="pay-yer-btn" style="margin-top:8px;">دفع بـ YER فقط</button>
        <button id="pay-hybrid-btn" style="margin-top:8px; background: linear-gradient(135deg, #d4af37, #b8960c);">دفع هجين (Pi + YER)</button>
      </div>
      <div class="card">
        <h2>📊 حالة النظام</h2>
        <div class="status-row"><span>Pi Authentication</span><span class="badge online">نشط</span></div>
        <div class="status-row"><span>Pi Payments</span><span class="badge pending">قيد التطوير</span></div>
        <div class="status-row"><span>YER Token</span><span class="badge pending">قيد التطوير</span></div>
      </div>
    </section>
  </main>
  <script src="js/pi-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
