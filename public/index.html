<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المقاصة السيادية التجريبية - BIGISH-YER (Sandbox)</title>
    
    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f1e; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1a1a2e; border: 1px solid #333; padding: 20px; border-radius: 12px; max-width: 450px; margin: 0 auto 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, select, button { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; font-size: 16px; }
        input, select { background: #252542; color: #fff; box-sizing: border-box; }
        button { font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-gold { background: gold; color: #000; }
        .btn-green { background: #28a745; color: #fff; }
        #qr-visual-container { margin: 15px auto; background: white; padding: 10px; display: inline-block; border-radius: 8px; }
        .badge { display: inline-block; padding: 5px 10px; background: #007bff; border-radius: 4px; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🦅 منظومة الصقر العربي للمقاصة السيادية (وضع المحاكاة)</h2>
    <p>نسخة تجريبية (Sandbox) - لا توجد أي علاقة رسمية مع Pi Network أو UNICEF</p>

    <!-- بطاقة توليد رمز QR للاستلام -->
    <div class="card">
        <h3>📥 طلب استلام فوري (توليد QR)</h3>
        <!-- تم إزالة step="any" لمنع الإدخال العشري غير الدقيق -->
        <input type="text" id="ui-amount" placeholder="أدخل المبلغ (أرقام صحيحة فقط)" pattern="[0-9]+">
        <select id="ui-currency">
            <option value="YER">YER Token (محاكاة)</option>
            <option value="Pi">Pi Coin (محاكاة)</option>
        </select>
        <button class="btn-gold" onclick="actionGenerate()">إنشاء رمز QR تجريبي</button>
        
        <div id="qr-wrapper" style="display: none;">
            <div id="qr-visual-container"></div>
            <div style="font-size: 11px; color: #aaa; word-break: break-all; margin-top: 5px;" id="ui-string-payload"></div>
        </div>
    </div>

    <!-- بطاقة معالجة ودفع رمز QR الممسوح -->
    <div class="card">
        <h3>💸 مسح ودفع الفاتورة (محاكاة)</h3>
        <input type="text" id="ui-scan-input" placeholder="الصق نص الـ PAYLOAD المشفر هنا">
        <button class="btn-green" onclick="actionPay()">تأكيد المعاملة (محاكاة)</button>
        <div id="ui-status-msg" style="margin-top: 15px; font-weight: bold; font-size: 15px;"></div>
    </div>

    <!-- استدعاء المحرك الصارم (نسخة متوافقة مع المتصفح) -->
    <script src="qr_clearing_handler_browser.js"></script>
    <script>
        // محاولة إنشاء الكائن من الكلاس المتاح في المتصفح
        // إذا كان الملف يستخدم module.exports، يجب تحميله كـ script وليس module
        const engine = new QrClearingEngine();
        const mySovereignWallet = "G-AEC-YEMEN-SQUE-2026-ACTIVE-METADATA";

        function actionGenerate() {
            const amt = document.getElementById('ui-amount').value;
            const cur = document.getElementById('ui-currency').value;
            const wrapper = document.getElementById('qr-wrapper');
            const visual = document.getElementById('qr-visual-container');
            const strOut = document.getElementById('ui-string-payload');
            
            try {
                // 1. توليد السلسلة النصية المشفرة
                const payload = engine.generateQrPayload(mySovereignWallet, amt, cur);
                const fullPayloadString = `PAYLOAD:${payload}`;
                
                // 2. تصيير ورسم الـ QR كـ SVG رسومي (يعمل بدون إنترنت)
                visual.innerHTML = engine.generateRawSvgHtml(fullPayloadString, 200);
                strOut.innerText = fullPayloadString;
                
                wrapper.style.display = "block";
                document.getElementById('ui-status-msg').style.color = "gold";
                document.getElementById('ui-status-msg').innerText = "✅ تم إنشاء رمز QR تجريبي بنجاح!";
            } catch (e) {
                alert("خطأ: " + e.message);
            }
        }

        function actionPay() {
            const rawText = document.getElementById('ui-scan-input').value.replace("PAYLOAD:", "").trim();
            const msg = document.getElementById('ui-status-msg');
            
            const receipt = engine.parseQrPayload(rawText);
            if (receipt.success) {
                msg.style.color = "#28a745";
                msg.innerHTML = `🚀 تمت المعاملة (محاكاة)!<br>
                                 <b>المبلغ:</b> ${receipt.rawAmount} ${receipt.currency}<br>
                                 <b>إلى المحفظة:</b> <span style='font-size:11px;color:cyan;'>${receipt.receiver}</span><br>
                                 <b>البروتوكول:</b> <span class='badge'>${receipt.node}</span>`;
            } else {
                msg.style.color = "#dc3545";
                msg.innerText = `❌ فشل: ${receipt.error}`;
            }
        }
    </script>
</body>
</html>
